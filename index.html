<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickConvert - Free Unit & Currency Converter</title>
<meta name="description" content="Fast, free unit, weight, temperature, volume and currency converter. No signup required." />

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6423020951801749" crossorigin="anonymous"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <h1>QuickConvert</h1>
  <p class="tagline">Fast, free, no-signup unit & currency conversion</p>
</header>

<!-- Top ad slot -->
<div class="ad-slot" id="ad-top">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-6423020951801749"
       data-ad-slot="0000000000"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>

<main class="container">

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="length">Length</button>
    <button class="tab-btn" data-tab="weight">Weight</button>
    <button class="tab-btn" data-tab="temperature">Temperature</button>
    <button class="tab-btn" data-tab="volume">Volume</button>
    <button class="tab-btn" data-tab="currency">Currency</button>
  </nav>

  <section class="converter-card">
    <div class="row">
      <input type="number" id="inputValue" value="1" />
      <select id="fromUnit"></select>
      <span class="arrow">&#8594;</span>
      <select id="toUnit"></select>
    </div>

    <div class="result" id="result">Result: --</div>
  </section>

  <!-- Mid-content ad slot -->
  <div class="ad-slot" id="ad-mid">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-6423020951801749"
         data-ad-slot="1111111111"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <section class="support-card" id="supportCard">
    <p>Enjoying QuickConvert? Remove all ads forever for a small one-time payment.</p>
    <a id="removeAdsBtn" class="btn-primary" href="https://rzp.io/rzp/REPLACE_WITH_YOUR_PAYMENT_LINK" target="_blank" rel="noopener">
      Remove Ads - &#8377;149 (one-time)
    </a>
    <button id="alreadyPaidBtn" class="btn-secondary">I already paid</button>
  </section>

</main>

<footer class="site-footer">

</footer>
